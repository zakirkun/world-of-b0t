worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;

        # Custom cyberpunk 404.
        error_page 404 /404.html;
        location = /404.html { internal; }

        # Landing page + assets.
        location / {
            index  index.html;
            try_files $uri $uri/ =404;
        }

        # The hook: a browsable, autoindexed backup directory.
        # ^~ beats the deny-regex below so the leaked source stays readable.
        location ^~ /backup/ {
            autoindex on;
            autoindex_exact_size off;
        }

        # The vault subdir is NOT listed -- you need the leaked token to name
        # the flag file inside it.
        location ^~ /backup/vault/ {
            autoindex off;
        }

        # Nothing else is browsable.
        location /src/ { return 403; }

        # Deny source/config extensions everywhere except /backup/.
        location ~* \.(py|bak|old|conf|log|env)$ { return 404; }
    }
}
