# GHOST SHELL :: edge proxy
#
# The front door. It terminates the host-facing surface and forwards to the ops
# console. It adds nothing security-relevant on purpose - the lab's chain lives
# behind it, and an edge that "helpfully" blocked things would hide the bug.
#
# One thing it DOES do: it strips its own Server noise and passes the raw target
# through untouched, so path handling is the app's problem, not nginx's.

upstream ghost_shell {
    server w0b-w10-console:8080;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Edge health, served without touching the upstream. The lab probe polls the
    # proxied surface instead, so this staying up does not mask a dead console.
    location = /edge/health {
        default_type application/json;
        return 200 '{"service":"ghost-shell-edge","up":true}';
    }

    location / {
        proxy_pass http://ghost_shell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the request target through unchanged.
        proxy_pass_request_body on;
    }
}
