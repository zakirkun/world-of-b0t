services:
  internal:
    build:
      context: .
      dockerfile: Dockerfile.internal
    container_name: w0b-w11-internal
    environment:
      W0B_FLAG: ${W0B_FLAG:?must set W0B_FLAG - use manage.ps1/manage.sh}
    networks:
      - w0b
    restart: unless-stopped
    # No ports: this service is reachable ONLY from inside the w0b network.

  w11:
    build: .
    container_name: w0b-w11
    depends_on:
      - internal
    ports:
      - "30011:8080"
    environment:
      W0B_FLAG: ${W0B_FLAG:?must set W0B_FLAG - use manage.ps1/manage.sh}
      ORIGIN_URL: http://w0b-w11-internal:9000
    networks:
      - w0b
    restart: unless-stopped

networks:
  w0b:
    name: w0b
    external: true
