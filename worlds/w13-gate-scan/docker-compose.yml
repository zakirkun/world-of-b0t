services:
  internal:
    build:
      context: .
      dockerfile: Dockerfile.internal
    container_name: w0b-w13-internal
    # The farm answers to two names on the w0b network. The prober's blocklist
    # only knows the container name; `statusfarm` is the migration alias it was
    # never taught. This is the gap the lab is built on.
    networks:
      w0b:
        aliases:
          - statusfarm
    environment:
      W0B_FLAG: ${W0B_FLAG:?must set W0B_FLAG - use manage.ps1/manage.sh}
    restart: unless-stopped
    # No ports: reachable ONLY from inside the w0b network.

  w13:
    build: .
    container_name: w0b-w13
    depends_on:
      - internal
    ports:
      - "30013:8080"
    environment:
      W0B_FLAG: ${W0B_FLAG:?must set W0B_FLAG - use manage.ps1/manage.sh}
    networks:
      - w0b
    restart: unless-stopped

networks:
  w0b:
    name: w0b
    external: true
