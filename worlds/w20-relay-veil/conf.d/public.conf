# RELAY VEIL :: public route table
# Loaded by the relay at boot. Each block declares one route.
#
#   route <public-path> <upstream> <auth>
#
# auth is one of: none | token
# A route with auth=token requires the X-Relay-Token header, which the edge
# strips from all inbound traffic. Internal consumers set it themselves.

route /health   internal:health   none
route /status   internal:status   none
route /echo     internal:echo     none
